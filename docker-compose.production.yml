# Stack de produção/staging para um VPS único (beta).
# NÃO inclui PostgreSQL: use o banco já existente (Supabase ou Postgres gerenciado).
#
# Uso:
#   cp .env.production.example .env.production
#   # preencha secrets e DNS
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d --build
#
# Desenvolvimento local continua com `pnpm dev` + docker-compose.yml (Postgres opcional).

services:
  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5

  admin:
    build:
      context: .
      dockerfile: deploy/docker/admin.Dockerfile
      args:
        ADMIN_STANDALONE: "1"
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      ADMIN_STANDALONE: "1"
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy

  driver:
    build:
      context: .
      dockerfile: deploy/docker/driver.Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    expose:
      - "8081"
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      API_HOST: ${API_HOST}
      OCPP_HOST: ${OCPP_HOST}
      ADMIN_HOST: ${ADMIN_HOST}
      APP_HOST: ${APP_HOST}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - admin
      - driver

volumes:
  caddy_data:
  caddy_config:
