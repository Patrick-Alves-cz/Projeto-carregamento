services:
  postgres:
    image: postgres:16-alpine
    container_name: evcharge-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: evcharge
      POSTGRES_PASSWORD: evcharge
      POSTGRES_DB: evcharge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evcharge -d evcharge"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
